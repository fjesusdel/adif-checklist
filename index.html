<title>Checklist Mantenimiento ADIF · Ilunion Seguridad</title>
<style>
:root {
  --azul:     #003087;
  --azul-mid: #00408a;
  --azul-claro: #e8eef8;
  --amarillo: #FFD100;
  --gris-oscuro: #2d2d2d;
  --gris-medio: #6b6b6b;
  --gris-borde: #d1d5db;
  --gris-fondo: #f4f6fa;
  --blanco: #ffffff;
  --verde:   #16a34a;
  --rojo:    #dc2626;
  --naranja: #ea580c;
  --radio:   10px;
  --sombra:  0 2px 12px rgba(0,48,135,0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: var(--gris-fondo);
  color: var(--gris-oscuro);
  min-height: 100vh;
  font-size: 15px;
}

/* ── HEADER ─────────────────────────────────── */
header {
  background: var(--azul);
  padding: 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  max-width: 700px;
  margin: 0 auto;
}
.logo-wrap img {
  height: 42px;
  display: block;
  /* no filter */;
}
.header-title {
  text-align: right;
}
.header-title h1 {
  color: var(--blanco);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.header-title p {
  color: var(--amarillo);
  font-size: 11px;
  margin-top: 1px;
}
.header-bar {
  background: var(--amarillo);
  height: 4px;
}

/* ── PROGRESS BAR ───────────────────────────── */
#progress-bar-wrap {
  background: var(--azul-mid);
  padding: 6px 16px;
  display: none;
}
#progress-bar-wrap.visible { display: block; }
.progress-track {
  background: rgba(255,255,255,0.2);
  border-radius: 99px;
  height: 6px;
  overflow: hidden;
}
.progress-fill {
  background: var(--amarillo);
  height: 100%;
  border-radius: 99px;
  transition: width 0.3s ease;
  width: 0%;
}
.progress-label {
  color: rgba(255,255,255,0.85);
  font-size: 11px;
  margin-top: 4px;
  text-align: right;
}

/* ── MAIN CONTAINER ─────────────────────────── */
.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 16px;
}

/* ── CARDS ──────────────────────────────────── */
.card {
  background: var(--blanco);
  border-radius: var(--radio);
  box-shadow: var(--sombra);
  padding: 20px;
  margin-bottom: 14px;
}
.card-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--azul);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.card-title::before {
  content: '';
  display: block;
  width: 3px;
  height: 16px;
  background: var(--amarillo);
  border-radius: 2px;
  flex-shrink: 0;
}

/* ── SEARCH ─────────────────────────────────── */
.search-wrap {
  position: relative;
  margin-bottom: 12px;
}
.search-wrap input {
  width: 100%;
  padding: 11px 14px 11px 38px;
  border: 1.5px solid var(--gris-borde);
  border-radius: 8px;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
}
.search-wrap input:focus { border-color: var(--azul); }
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gris-medio);
  pointer-events: none;
  font-size: 16px;
}

/* ── PROVINCIA FILTER ───────────────────────── */
.provincia-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.pill {
  padding: 4px 11px;
  border: 1.5px solid var(--gris-borde);
  border-radius: 99px;
  font-size: 12px;
  cursor: pointer;
  background: var(--blanco);
  color: var(--gris-medio);
  transition: all 0.15s;
  white-space: nowrap;
}
.pill.active {
  background: var(--azul);
  border-color: var(--azul);
  color: var(--blanco);
  font-weight: 600;
}

/* ── INSTALACION LIST ───────────────────────── */
.inst-list { display: flex; flex-direction: column; gap: 7px; }
.inst-item {
  border: 1.5px solid var(--gris-borde);
  border-radius: 8px;
  padding: 12px 14px;
  cursor: pointer;
  background: var(--blanco);
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.inst-item:hover { border-color: var(--azul); background: var(--azul-claro); }
.inst-item.selected { border-color: var(--azul); background: var(--azul-claro); }
.inst-info { flex: 1; min-width: 0; }
.inst-nombre { font-weight: 600; font-size: 14px; color: var(--gris-oscuro); }
.inst-meta { font-size: 12px; color: var(--gris-medio); margin-top: 2px; }
.inst-codigo {
  font-size: 11px;
  color: var(--azul);
  background: var(--azul-claro);
  padding: 2px 7px;
  border-radius: 4px;
  white-space: nowrap;
  font-weight: 600;
}
.inst-sistemas {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 5px;
}
.tag {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.tag-intrusion { background: #dbeafe; color: #1e40af; }
.tag-cctv      { background: #dcfce7; color: #166534; }
.tag-ccaa      { background: #fef3c7; color: #92400e; }
.tag-interfonia{ background: #f3e8ff; color: #6b21a8; }
.tag-pci       { background: #fee2e2; color: #991b1b; }
.tag-eq-gen    { background: #f1f5f9; color: #475569; }

/* ── TIPO VISITA SELECTOR ───────────────────── */
.tipo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.tipo-btn {
  border: 2px solid var(--gris-borde);
  border-radius: 10px;
  padding: 16px 12px;
  cursor: pointer;
  background: var(--blanco);
  text-align: center;
  transition: all 0.15s;
}
.tipo-btn:hover { border-color: var(--azul); }
.tipo-btn.selected { border-color: var(--azul); background: var(--azul-claro); }
.tipo-icon { font-size: 28px; margin-bottom: 6px; }
.tipo-label { font-weight: 700; font-size: 13px; color: var(--azul); }
.tipo-desc  { font-size: 11px; color: var(--gris-medio); margin-top: 3px; line-height: 1.4; }
.tipo-btn.pci-btn { grid-column: span 2; }

/* ── FICHA TECNICA ──────────────────────────── */
.ficha-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.ficha-grid.full { grid-template-columns: 1fr; }
.ficha-field label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--gris-medio);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-bottom: 4px;
}
.ficha-field input, .ficha-field textarea {
  width: 100%;
  border: 1.5px solid var(--gris-borde);
  border-radius: 7px;
  padding: 9px 11px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  transition: border-color 0.2s;
  resize: vertical;
}
.ficha-field input:focus, .ficha-field textarea:focus { border-color: var(--azul); }

/* ── CHECKLIST ──────────────────────────────── */
.sistema-section { margin-bottom: 20px; }
.sistema-header {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--azul);
  color: var(--blanco);
  border-radius: 8px 8px 0 0;
  padding: 10px 14px;
  font-weight: 700;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.sistema-body {
  border: 1.5px solid var(--gris-borde);
  border-top: none;
  border-radius: 0 0 8px 8px;
  overflow: hidden;
}
.check-item {
  border-bottom: 1px solid var(--gris-borde);
  padding: 12px 14px;
  background: var(--blanco);
  transition: background 0.1s;
}
.check-item:last-child { border-bottom: none; }
.check-item.estado-ok      { background: #f0fdf4; }
.check-item.estado-inc     { background: #fff7ed; }
.check-item.estado-na      { background: #f8fafc; opacity: 0.65; }
.check-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.check-code {
  font-size: 10px;
  font-weight: 700;
  color: var(--blanco);
  background: var(--azul);
  padding: 2px 6px;
  border-radius: 3px;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 2px;
}
.check-text { flex: 1; }
.check-nombre { font-size: 13px; font-weight: 600; line-height: 1.35; }
.check-desc   { font-size: 12px; color: var(--gris-medio); margin-top: 3px; line-height: 1.4; }
.check-btns {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.btn-estado {
  flex: 1;
  padding: 8px 4px;
  border: 2px solid var(--gris-borde);
  border-radius: 7px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  background: var(--blanco);
  transition: all 0.15s;
  text-align: center;
}
.btn-ok:hover, .btn-ok.active {
  background: var(--verde);
  border-color: var(--verde);
  color: var(--blanco);
}
.btn-inc:hover, .btn-inc.active {
  background: var(--naranja);
  border-color: var(--naranja);
  color: var(--blanco);
}
.btn-na:hover, .btn-na.active {
  background: var(--gris-medio);
  border-color: var(--gris-medio);
  color: var(--blanco);
}
.check-desc-inc {
  margin-top: 8px;
  display: none;
}
.check-desc-inc.visible { display: block; }
.check-desc-inc textarea {
  width: 100%;
  border: 1.5px solid var(--naranja);
  border-radius: 7px;
  padding: 8px 10px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  resize: vertical;
  min-height: 60px;
}

/* ── RESUMEN ─────────────────────────────────── */
.resumen-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.stat-box {
  text-align: center;
  padding: 14px 8px;
  border-radius: 8px;
}
.stat-box.ok  { background: #dcfce7; }
.stat-box.inc { background: #ffedd5; }
.stat-box.na  { background: #f1f5f9; }
.stat-num {
  font-size: 28px;
  font-weight: 800;
  line-height: 1;
}
.stat-box.ok  .stat-num { color: var(--verde); }
.stat-box.inc .stat-num { color: var(--naranja); }
.stat-box.na  .stat-num { color: var(--gris-medio); }
.stat-label { font-size: 11px; font-weight: 600; color: var(--gris-medio); margin-top: 4px; text-transform: uppercase; }

.incidencias-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.inc-item {
  border-left: 3px solid var(--naranja);
  padding: 8px 12px;
  background: #fff7ed;
  border-radius: 0 6px 6px 0;
}
.inc-code { font-size: 11px; font-weight: 700; color: var(--naranja); }
.inc-nombre { font-size: 13px; font-weight: 600; margin-top: 1px; }
.inc-detalle { font-size: 12px; color: var(--gris-medio); margin-top: 2px; }

/* ── BOTONES PRINCIPALES ────────────────────── */
.btn-primary {
  display: block;
  width: 100%;
  padding: 14px;
  background: var(--azul);
  color: var(--blanco);
  border: none;
  border-radius: 9px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: background 0.15s;
  margin-bottom: 10px;
}
.btn-primary:hover { background: #00205e; }
.btn-primary:disabled { background: var(--gris-borde); color: var(--gris-medio); cursor: not-allowed; }
.btn-secondary {
  display: block;
  width: 100%;
  padding: 12px;
  background: var(--blanco);
  color: var(--azul);
  border: 2px solid var(--azul);
  border-radius: 9px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  margin-bottom: 10px;
}
.btn-secondary:hover { background: var(--azul-claro); }
.btn-amarillo {
  display: block;
  width: 100%;
  padding: 14px;
  background: var(--amarillo);
  color: var(--azul);
  border: none;
  border-radius: 9px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  margin-bottom: 10px;
}
.btn-amarillo:hover { background: #e6bc00; }
.btn-whatsapp {
  display: block;
  width: 100%;
  padding: 14px;
  background: #25D366;
  color: var(--blanco);
  border: none;
  border-radius: 9px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  margin-bottom: 10px;
}
.btn-whatsapp:hover { background: #1da851; }

/* ── BADGE TIPO VISITA ──────────────────────── */
.badge-tipo {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--amarillo);
  color: var(--azul);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 99px;
  margin-bottom: 12px;
}

/* ── TOAST ──────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--gris-oscuro);
  color: var(--blanco);
  padding: 11px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  z-index: 999;
  transition: transform 0.3s ease;
  white-space: nowrap;
  pointer-events: none;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* ── STICKY BOTTOM BAR ──────────────────────── */
.sticky-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--blanco);
  border-top: 1px solid var(--gris-borde);
  padding: 10px 16px;
  z-index: 90;
  display: none;
}
.sticky-bar.visible { display: flex; gap: 10px; }
.sticky-bar .btn-primary, .sticky-bar .btn-secondary {
  margin: 0; flex: 1;
}

/* ── UTILITIES ──────────────────────────────── */
.hidden { display: none !important; }
.text-center { text-align: center; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }

/* ── NOTA REMOTA ────────────────────────────── */
.nota-remota {
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12px;
  color: #1e40af;
  margin-bottom: 14px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  line-height: 1.5;
}

/* ── INFO INSTALACION SELECCIONADA ──────────── */
.inst-selected-card {
  background: var(--azul);
  color: var(--blanco);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.isc-nombre { font-size: 16px; font-weight: 700; }
.isc-meta   { font-size: 12px; opacity: 0.8; margin-top: 2px; }
.isc-change {
  background: rgba(255,255,255,0.15);
  color: var(--blanco);
  border: none;
  border-radius: 6px;
  padding: 6px 11px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}

</style>

// ═══════════════════════════════════════════════════════════════════════
// PASO 1 — SELECCIÓN INSTALACIÓN
// ═══════════════════════════════════════════════════════════════════════
let provinciaActiva = 'Todas';

function initPaso1() {
  // Pills de provincia
  const provincias = ['Todas', ...new Set(INSTALACIONES.map(i => i.provincia))];
  const pillsEl = document.getElementById('provinciaPills');
  pillsEl.innerHTML = provincias.map(p =>
    `<button class="pill ${p===provinciaActiva?'active':''}" onclick="setProvincia('${p}')">${p}</button>`
  ).join('');

  // Poner fecha de hoy por defecto
  document.getElementById('fFecha').value = new Date().toISOString().split('T')[0];

  renderInstList();
}

function setProvincia(p) {
  provinciaActiva = p;
  document.querySelectorAll('.pill').forEach(el => {
    el.classList.toggle('active', el.textContent === p);
  });
  renderInstList();
}

function filtrarInstalaciones() { renderInstList(); }

function renderInstList() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const lista = INSTALACIONES.filter(i => {
    const matchProv = provinciaActiva === 'Todas' || i.provincia === provinciaActiva;
    const matchQ = !q || i.nombre.toLowerCase().includes(q) || i.codigo.toLowerCase().includes(q);
    return matchProv && matchQ;
  });
  const el = document.getElementById('instList');
  if (lista.length === 0) {
    el.innerHTML = '<div style="padding:20px;text-align:center;color:#6b6b6b;">No se encontraron instalaciones</div>';
    return;
  }
  el.innerHTML = lista.map(i => `
    <div class="inst-item ${state.instalacion?.codigo===i.codigo?'selected':''}" onclick="seleccionarInst('${i.codigo}')">
      <div class="inst-info">
        <div class="inst-nombre">${i.nombre}</div>
        <div class="inst-meta">${i.provincia} · ${i.tipo} · ${i.tamaño}</div>
        <div class="inst-sistemas">
          ${i.sistemas.map(s=>`<span class="tag ${TAG_CLASSES[s]||'tag-eq-gen'}">${SISTEMAS_LABELS[s]||s}</span>`).join('')}
        </div>
      </div>
      <div class="inst-codigo">${i.codigo}</div>
    </div>
  `).join('');
}

function seleccionarInst(codigo) {
  state.instalacion = INSTALACIONES.find(i => i.codigo === codigo);
  state.tipoVisita = null;
  state.resultados = {};
  irPaso2();
}

// ═══════════════════════════════════════════════════════════════════════
// PASO 2 — TIPO DE VISITA
// ═══════════════════════════════════════════════════════════════════════
function irPaso2() {
  mostrarPaso('paso2');
  renderInstCard('instSelectedCard2');

  const inst = state.instalacion;
  const tienePCI = inst.sistemas.includes('pci');
  const grid = document.getElementById('tipoGrid');
  let html = `
    <div class="tipo-btn ${state.tipoVisita==='anual'?'selected':''}" onclick="seleccionarTipo('anual')">
      <div class="tipo-icon">🔧</div>
      <div class="tipo-label">Revisión Anual</div>
      <div class="tipo-desc">Visita presencial completa. Incluye inspección física, mediciones y pruebas funcionales.</div>
    </div>
    <div class="tipo-btn ${state.tipoVisita==='trimestral'?'selected':''}" onclick="seleccionarTipo('trimestral')">
      <div class="tipo-icon">💻</div>
      <div class="tipo-label">Revisión Trimestral</div>
      <div class="tipo-desc">Revisión remota por VPN. Solo puntos verificables sin desplazamiento presencial.</div>
    </div>`;
  if (tienePCI) {
    html += `
    <div class="tipo-btn pci-btn ${state.tipoVisita==='pci-trim'?'selected':''}" onclick="seleccionarTipo('pci-trim')">
      <div class="tipo-icon">🔥</div>
      <div class="tipo-label">Revisión Trimestral PCI</div>
      <div class="tipo-desc">Revisión trimestral específica del sistema de Detección de Incendios según RD 513/2017 (RIPCI).</div>
    </div>`;
  }
  grid.innerHTML = html;
  document.getElementById('btnConfirmarTipo').disabled = !state.tipoVisita;
}

function seleccionarTipo(tipo) {
  state.tipoVisita = tipo;
  document.querySelectorAll('.tipo-btn').forEach(el => el.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  document.getElementById('btnConfirmarTipo').disabled = false;
}

function getPuntosParaTipo(tipoVisita) {
  // Qué periodicidades mostrar según el tipo de visita elegido
  if (tipoVisita === 'anual')      return ['anual','trim','pci-trim'];  // todos
  if (tipoVisita === 'trimestral') return ['trim'];
  if (tipoVisita === 'pci-trim')   return ['pci-trim'];
  return ['anual'];
}

function renderChecklist() {
  const inst = state.instalacion;
  const tipo = state.tipoVisita;
  const periodOK = getPuntosParaTipo(tipo);

  // Nota remota
  const notaEl = document.getElementById('notaRemota');
  if (tipo === 'trimestral') {
    notaEl.innerHTML = `<div class="nota-remota">ℹ️ <span>Revisión trimestral <strong>remota por VPN</strong>. Solo se muestran los puntos verificables sin presencia física. Los puntos de inspección visual, mediciones y pruebas presenciales se revisarán en la visita anual.</span></div>`;
  } else if (tipo === 'pci-trim') {
    notaEl.innerHTML = `<div class="nota-remota">🔥 <span>Revisión trimestral <strong>PCI según RD 513/2017</strong>. Solo puntos del sistema de Detección de Incendios exigidos en la Tabla I del RIPCI.</span></div>`;
  } else {
    notaEl.innerHTML = '';
  }

  // Sistemas a mostrar
  let sistemasAMostrar = [...inst.sistemas, 'eq_general'];
  if (tipo === 'pci-trim') sistemasAMostrar = ['pci'];

  const container = document.getElementById('checklistContainer');
  let html = '';

  sistemasAMostrar.forEach(sist => {
    const def = CHECKLIST[sist];
    if (!def) return;

    // Filtrar items según periodicidad
    const gruposConItems = def.grupos.map(g => ({
      ...g,
      items: g.items.filter(it => periodOK.includes(it.p))
    })).filter(g => g.items.length > 0);

    if (gruposConItems.length === 0) return;

    html += `<div class="sistema-section">
      <div class="sistema-header">${def.label}</div>
      <div class="sistema-body">`;

    gruposConItems.forEach(grupo => {
      grupo.items.forEach(item => {
        const res = state.resultados[item.c] || {};
        const est = res.estado || '';
        html += `
        <div class="check-item ${est?'estado-'+est:''}" id="ci_${item.c}">
          <div class="check-top">
            <span class="check-code">${item.c}</span>
            <div class="check-text">
              <div class="check-nombre">${item.n}</div>
              <div class="check-desc">${item.d}</div>
            </div>
          </div>
          <div class="check-btns">
            <button class="btn-estado btn-ok ${est==='ok'?'active':''}" onclick="setEstado('${item.c}','ok',this)">✓ OK</button>
            <button class="btn-estado btn-inc ${est==='inc'?'active':''}" onclick="setEstado('${item.c}','inc',this)">⚠ Incidencia</button>
            <button class="btn-estado btn-na ${est==='na'?'active':''}" onclick="setEstado('${item.c}','na',this)">— N/A</button>
          </div>
          <div class="check-desc-inc ${est==='inc'?'visible':''}" id="desc_${item.c}">
            <textarea placeholder="Describe la incidencia..." oninput="setDesc('${item.c}',this.value)">${res.desc||''}</textarea>
          </div>
        </div>`;
      });
    });
    html += `</div></div>`;
  });

  container.innerHTML = html;
  actualizarProgress();
}

function setEstado(codigo, estado, btn) {
  if (!state.resultados[codigo]) state.resultados[codigo] = {};
  state.resultados[codigo].estado = estado;

  const ci = document.getElementById('ci_'+codigo);
  ci.className = 'check-item estado-'+estado;
  ci.querySelectorAll('.btn-estado').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const descEl = document.getElementById('desc_'+codigo);
  if (estado === 'inc') descEl.classList.add('visible');
  else descEl.classList.remove('visible');

  actualizarProgress();
}

function setDesc(codigo, val) {
  if (!state.resultados[codigo]) state.resultados[codigo] = {};
  state.resultados[codigo].desc = val;
}

function actualizarProgress() {
  const tipo = state.tipoVisita;
  const periodOK = getPuntosParaTipo(tipo);
  const inst = state.instalacion;
  let sistemasAMostrar = [...inst.sistemas, 'eq_general'];
  if (tipo === 'pci-trim') sistemasAMostrar = ['pci'];

  let total = 0, revisados = 0;
  sistemasAMostrar.forEach(sist => {
    const def = CHECKLIST[sist];
    if (!def) return;
    def.grupos.forEach(g => {
      g.items.filter(it => periodOK.includes(it.p)).forEach(item => {
        total++;
        if (state.resultados[item.c]?.estado) revisados++;
      });
    });
  });

  const pct = total ? Math.round(revisados/total*100) : 0;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('progressLabel').textContent = `${revisados} / ${total} puntos revisados (${pct}%)`;
}

function generarTextoInforme() {
  const inst = state.instalacion;
  const fv = state.fichaVisita;
  const tipo = state.tipoVisita;
  const tipoLabel = tipo==='anual'?'Revisión Anual':tipo==='trimestral'?'Revisión Trimestral Remota':'Revisión Trimestral PCI';
  const periodOK = getPuntosParaTipo(tipo);
  let sistemasAMostrar = [...inst.sistemas,'eq_general'];
  if (tipo==='pci-trim') sistemasAMostrar = ['pci'];

  let txt = `INFORME DE MANTENIMIENTO PREVENTIVO — ILUNION SEGURIDAD\n`;
  txt += `Contrato ADIF 4.26/28510.0005 · RC Sur\n`;
  txt += `${'='.repeat(55)}\n\n`;
  txt += `INSTALACIÓN: ${inst.nombre} (${inst.codigo})\n`;
  txt += `Provincia: ${inst.provincia} · ${inst.tipo} · ${inst.tamaño}\n`;
  txt += `Tipo de visita: ${tipoLabel}\n`;
  txt += `Técnico: ${fv.tecnico||'—'}\n`;
  txt += `Fecha: ${fv.fecha||'—'}\n`;
  txt += `Hora entrada: ${fv.horaIn||'—'}  Hora salida: ${fv.horaOut||'—'}\n\n`;

  let nOk=0,nInc=0,nNa=0,total=0;
  sistemasAMostrar.forEach(sist=>{
    const def=CHECKLIST[sist]; if(!def)return;
    def.grupos.forEach(g=>{
      g.items.filter(it=>periodOK.includes(it.p)).forEach(item=>{
        total++;
        const res=state.resultados[item.c]||{};
        if(res.estado==='ok') nOk++; else if(res.estado==='inc') nInc++; else if(res.estado==='na') nNa++;
      });
    });
  });
  txt += `RESUMEN: ${nOk} correctos · ${nInc} incidencias · ${nNa} no aplica · Total: ${total}\n\n`;

  sistemasAMostrar.forEach(sist=>{
    const def=CHECKLIST[sist]; if(!def)return;
    const gruposConItems=def.grupos.map(g=>({...g,items:g.items.filter(it=>periodOK.includes(it.p))})).filter(g=>g.items.length>0);
    if(gruposConItems.length===0)return;
    txt+=`\n${def.label.toUpperCase()}\n${'-'.repeat(40)}\n`;
    gruposConItems.forEach(g=>{
      txt+=`\n${g.g}\n`;
      g.items.forEach(item=>{
        const res=state.resultados[item.c]||{};
        const est=res.estado==='ok'?'[OK]':res.estado==='inc'?'[INCIDENCIA]':res.estado==='na'?'[N/A]':'[PENDIENTE]';
        txt+=`  ${est} ${item.c} — ${item.n}\n`;
        if(res.desc) txt+=`       → ${res.desc}\n`;
      });
    });
  });

  const ft=state.fichaTecnica;
  if(Object.keys(ft).length>0){
    txt+=`\n${'='.repeat(55)}\nFICHA TÉCNICA\n`;
    if(ft.ip_grabador)  txt+=`IP Grabador: ${ft.ip_grabador}:${ft.puerto_grabador||''}\n`;
    if(ft.ip_central)   txt+=`IP Central:  ${ft.ip_central} (${ft.modelo_central||''})\n`;
    if(ft.ip_uca)       txt+=`IP UCA:      ${ft.ip_uca}\n`;
    if(ft.notas)        txt+=`Notas: ${ft.notas}\n`;
  }
  txt+=`\n— Informe generado ${new Date().toLocaleString('es-ES')} · Ilunion Seguridad —`;
  return txt;
}

function generarCSV() {
  const inst = state.instalacion;
  const fv = state.fichaVisita;
  const tipo = state.tipoVisita;
  const periodOK = getPuntosParaTipo(tipo);
  let sistemasAMostrar = [...inst.sistemas,'eq_general'];
  if (tipo==='pci-trim') sistemasAMostrar=['pci'];

  let csv = 'Código;Sistema;Grupo;Punto;Estado;Descripción incidencia\n';
  sistemasAMostrar.forEach(sist=>{
    const def=CHECKLIST[sist]; if(!def)return;
    def.grupos.forEach(g=>{
      g.items.filter(it=>periodOK.includes(it.p)).forEach(item=>{
        const res=state.resultados[item.c]||{};
        const est=res.estado==='ok'?'OK':res.estado==='inc'?'INCIDENCIA':res.estado==='na'?'N/A':'PENDIENTE';
        const desc=(res.desc||'').replace(/;/g,',');
        const nombre=item.n.replace(/;/g,',');
        csv+=`${item.c};${sist};${g.g};${nombre};${est};${desc}\n`;
      });
    });
  });
  return csv;
}

async function compartirInforme() {
  const inst = state.instalacion;
  const fv = state.fichaVisita;
  const fecha = fv.fecha || new Date().toISOString().split('-').reverse().join('-');
  const tipoLabel = state.tipoVisita==='anual'?'Anual':state.tipoVisita==='trimestral'?'Trim_Remota':'Trim_PCI';
  const fname = `Informe_${inst.codigo}_${tipoLabel}_${fecha}.txt`;
  const txt = generarTextoInforme();

  // Web Share API — abre el menú nativo del móvil
  if (navigator.share) {
    try {
      const blob = new Blob([txt], {type: 'text/plain'});
      const file = new File([blob], fname, {type: 'text/plain'});
      if (navigator.canShare && navigator.canShare({files:[file]})) {
        await navigator.share({
          title: `Informe ${inst.nombre} — ${tipoLabel}`,
          text: `Informe de mantenimiento ADIF\nInstalación: ${inst.nombre} (${inst.codigo})\nFecha: ${fecha}`,
          files: [file]
        });
      } else {
        // Fallback: compartir solo texto sin archivo
        await navigator.share({
          title: `Informe ${inst.nombre}`,
          text: txt.substring(0, 2000)
        });
      }
      toast('Informe compartido ✓');
    } catch(e) {
      if (e.name !== 'AbortError') mostrarInformeTexto(txt, fname);
    }
  } else {
    // Escritorio o navegador sin Web Share API — mostrar en pantalla para copiar
    mostrarInformeTexto(txt, fname);
  }
}

function mostrarInformeTexto(txt, fname) {
  // Crear modal con el texto para copiar manualmente
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px;';
  modal.innerHTML = `
    <div style="background:#fff;border-radius:12px;padding:20px;max-width:600px;width:100%;max-height:90vh;display:flex;flex-direction:column;gap:12px;">
      <div style="font-weight:700;color:#003087;font-size:15px;">📄 Informe generado — Copia el texto</div>
      <textarea readonly style="flex:1;min-height:300px;border:1px solid #d1d5db;border-radius:8px;padding:10px;font-size:12px;font-family:monospace;resize:none;">${txt.replace(/</g,'&lt;')}</textarea>
      <div style="display:flex;gap:10px;">
        <button onclick="navigator.clipboard.writeText(this.closest('div').previousElementSibling.value).then(()=>toast('Copiado ✓'))" style="flex:1;padding:12px;background:#003087;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;">📋 Copiar</button>
        <button onclick="this.closest('[style*=fixed]').remove()" style="flex:1;padding:12px;background:#f1f5f9;color:#003087;border:2px solid #003087;border-radius:8px;font-weight:700;cursor:pointer;">Cerrar</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

function exportarCSV() {
  // En móvil usamos compartir; en escritorio descargamos
  const csv = generarCSV();
  const inst = state.instalacion;
  const fecha = state.fichaVisita.fecha || new Date().toISOString().split('T')[0];
  const tipoLabel = state.tipoVisita==='anual'?'Anual':state.tipoVisita==='trimestral'?'Trim_Remota':'Trim_PCI';
  const fname = `Informe_${inst.codigo}_${tipoLabel}_${fecha}.csv`;
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  
  // Intentar Web Share con archivo CSV
  if (navigator.share && navigator.canShare) {
    const file = new File([blob], fname, {type:'text/csv'});
    if (navigator.canShare({files:[file]})) {
      navigator.share({files:[file], title: 'Informe ADIF '+ inst.nombre})
        .then(()=>toast('CSV compartido ✓'))
        .catch(e=>{ if(e.name!=='AbortError') descargarBlob(blob, fname); });
      return;
    }
  }
  descargarBlob(blob, fname);
}

function descargarBlob(blob, fname) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=fname;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
  toast('Descarga iniciada ✓');
}

function _recogerDatos() {
  var inst = state.instalacion;
  var fv   = state.fichaVisita;
  var tipo = state.tipoVisita;
  var tipoLabel = tipo==='anual'?'Revision Anual Presencial':tipo==='trimestral'?'Revision Trimestral Remota':'Revision Trimestral PCI (RD 513/2017)';
  var periodOK = getPuntosParaTipo(tipo);
  var sistemas = tipo==='pci-trim' ? ['pci'] : inst.sistemas.concat(['eq_general']);
  var nOk=0, nInc=0, nNa=0, total=0;
  var incidencias = [];
  var filasPDF = [];

  sistemas.forEach(function(sist) {
    var def = CHECKLIST[sist]; if (!def) return;
    var grupos = def.grupos.map(function(g){
      return {g:g.g, items:g.items.filter(function(it){return periodOK.includes(it.p);})};
    }).filter(function(g){return g.items.length>0;});
    if (!grupos.length) return;
    grupos.forEach(function(grupo) {
      filasPDF.push({tipo:'header', texto: def.label + ' - ' + grupo.g});
      grupo.items.forEach(function(item) {
        total++;
        var res = state.resultados[item.c] || {};
        var est = res.estado || 'pendiente';
        if (est==='ok') nOk++;
        else if (est==='inc') { nInc++; incidencias.push({c:item.c, n:item.n, desc:res.desc||''}); }
        else if (est==='na') nNa++;
        filasPDF.push({tipo:'fila', codigo:item.c, nombre:item.n, estado:est, desc:res.desc||''});
      });
    });
  });
  var fechaStr = fv.fecha ? new Date(fv.fecha+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'}) : '-';
  return {inst:inst, fv:fv, tipo:tipo, tipoLabel:tipoLabel, nOk:nOk, nInc:nInc, nNa:nNa, total:total, incidencias:incidencias, filasPDF:filasPDF, fechaStr:fechaStr};
}

function _buildXLSX() {
  var d = _recogerDatos();
  var wb = XLSX.utils.book_new();

  var wsRes = XLSX.utils.aoa_to_sheet([
    ['INFORME DE MANTENIMIENTO PREVENTIVO - ILUNION SEGURIDAD'],
    ['Contrato ADIF 4.26/28510.0005 - RC Sur'],
    [],
    ['INSTALACION', d.inst.nombre],
    ['Codigo', d.inst.codigo],
    ['Provincia', d.inst.provincia],
    ['Tipo', d.inst.tipo],
    ['Tipo de visita', d.tipoLabel],
    [],
    ['DATOS DE LA VISITA'],
    ['Tecnico', d.fv.tecnico||'-'],
    ['Fecha', d.fechaStr],
    ['Hora entrada', d.fv.horaIn||'-'],
    ['Hora salida', d.fv.horaOut||'-'],
    [],
    ['RESULTADOS'],
    ['Correctos', d.nOk],
    ['Incidencias', d.nInc],
    ['No aplica', d.nNa],
    ['Pendientes', d.total-d.nOk-d.nInc-d.nNa],
    ['Total puntos', d.total],
  ]);
  wsRes['!cols'] = [{wch:22},{wch:45}];
  XLSX.utils.book_append_sheet(wb, wsRes, 'Resumen');

  var filas = [['Codigo','Grupo','Punto de revision','Estado','Observaciones']];
  var grupoActual = '';
  d.filasPDF.forEach(function(f) {
    if (f.tipo === 'header') { grupoActual = f.texto; }
    else {
      var label = f.estado==='ok'?'OK':f.estado==='inc'?'INCIDENCIA':f.estado==='na'?'N/A':'PENDIENTE';
      filas.push([f.codigo, grupoActual, f.nombre, label, f.desc||'']);
    }
  });
  var wsCheck = XLSX.utils.aoa_to_sheet(filas);
  wsCheck['!cols'] = [{wch:12},{wch:30},{wch:55},{wch:14},{wch:40}];
  XLSX.utils.book_append_sheet(wb, wsCheck, 'Checklist');

  if (d.incidencias.length > 0) {
    var incData = [['Codigo','Punto de revision','Descripcion de la incidencia']];
    d.incidencias.forEach(function(i){ incData.push([i.c, i.n, i.desc]); });
    var wsInc = XLSX.utils.aoa_to_sheet(incData);
    wsInc['!cols'] = [{wch:12},{wch:55},{wch:50}];
    XLSX.utils.book_append_sheet(wb, wsInc, 'Incidencias');
  }
  return wb;
}

function compartirExcel() {
  var d = _recogerDatos();
  var fname = 'Informe_' + d.inst.codigo + '_' + d.tipo + '_' + (d.fv.fecha||new Date().toISOString().split('T')[0]) + '.xlsx';
  var wb = _buildXLSX();
  var out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  var file = new File([new Uint8Array(out)], fname, {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

  if (navigator.share) {
    var shareData = {files:[file], title:'Informe '+d.inst.nombre, text:'Informe mantenimiento ADIF - '+d.inst.nombre+' - '+d.fechaStr};
    var canShare = !navigator.canShare || navigator.canShare(shareData);
    if (canShare) {
      navigator.share(shareData)
        .then(function(){ toast('Informe compartido ✓'); })
        .catch(function(e){ if(e.name!=='AbortError'){ descargarExcel(); toast('Guardado en Descargas'); } });
      return;
    }
  }
  descargarExcel();
  toast('Guardado en Descargas');
}

function descargarExcel() {
  var d = _recogerDatos();
  var fname = 'Informe_' + d.inst.codigo + '_' + d.tipo + '_' + (d.fv.fecha||new Date().toISOString().split('T')[0]) + '.xlsx';
  var wb = _buildXLSX();
  XLSX.writeFile(wb, fname);
  toast('Excel descargado \u2713');
}

function exportarCSV()    { descargarExcel(); }
function compartirArchivo(){ compartirExcel(); }
